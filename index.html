<style>/* === Preloader === */
#preloader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #F3F2E7;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), transform 1.1s cubic-bezier(0.65, 0, 0.35, 1);
}
#preloader.done {
  opacity: 0;
  transform: translateY(-32px);
  pointer-events: none;
}
#preloader.done .pl-inner {
  transform: scale(0.96);
  transition: transform 1.1s cubic-bezier(0.65, 0, 0.35, 1);
}
#preloader .pl-inner {
  text-align: center;
  position: relative;
  padding: 0 80px;
}
#preloader .pl-line {
  height: 1px;
  background: #CBB2A1;
  margin: 0 auto;
  transform-origin: center;
  animation: pl-line-grow 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}
#preloader .pl-line-top {
  width: 0;
  margin-bottom: 38px;
  animation-delay: 0.05s;
}
#preloader .pl-line-bot {
  width: 0;
  margin-top: 38px;
  animation-delay: 0.4s;
}
@keyframes pl-line-grow {
  0% { width: 0; }
  100% { width: 220px; }
}
#preloader .pl-mono {
  font-family: 'Pinyon Script', 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 132px;
  letter-spacing: 0;
  color: #262625;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 6px;
  line-height: 1;
}
#preloader .pl-l,
#preloader .pl-h {
  display: inline-block;
  opacity: 0;
  transform: translateY(18px);
  animation: pl-letter 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
#preloader .pl-l { animation-delay: 0.35s; }
#preloader .pl-h { animation-delay: 0.65s; }
#preloader .pl-amp {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 44px;
  color: #CBB2A1;
  opacity: 0;
  transform: scale(0.6);
  animation: pl-amp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
  position: relative;
  top: -38px;
  margin: 0 4px;
}
@keyframes pl-letter {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pl-amp {
  to { opacity: 1; transform: scale(1); }
}
#preloader .pl-brand {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 26px;
  letter-spacing: 0.02em;
  color: #262625;
  margin-top: 6px;
  opacity: 0;
  animation: pl-fade-in 1s ease 0.95s forwards;
}
#preloader .pl-name {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 11px;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: #7E746A;
  margin-top: 14px;
  opacity: 0;
  animation: pl-fade-in 0.9s ease 1.15s forwards;
}
#preloader .pl-sub {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 300;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #7E746A;
  margin-top: 8px;
  opacity: 0;
  animation: pl-fade-in 0.9s ease 1.3s forwards;
}
@media (max-width: 640px) {
  #preloader .pl-inner { padding: 0 24px; }
  #preloader .pl-line-top { margin-bottom: 28px; }
  #preloader .pl-line-bot { margin-top: 28px; }
  #preloader .pl-mono { font-size: 96px; gap: 4px; }
  #preloader .pl-amp { font-size: 32px; top: -26px; margin: 0 2px; }
  #preloader .pl-brand { font-size: 22px; margin-top: 4px; }
  #preloader .pl-name { font-size: 10px; letter-spacing: 0.32em; margin-top: 12px; }
  #preloader .pl-sub { font-size: 9px; letter-spacing: 0.28em; margin-top: 6px; }
}
@keyframes pl-line-grow-mobile {
  0% { width: 0; }
  100% { width: 160px; }
}
@media (max-width: 640px) {
  #preloader .pl-line { animation-name: pl-line-grow-mobile; }
}
@keyframes pl-fade-in {
  to { opacity: 1; }
}

:root {
  --bone: #F3F2E7;
  --cream: #E3DAC8;
  --clay: #CBB2A1;
  --taupe: #7E746A;
  --ink: #262625;
  --ink-70: rgba(38, 38, 37, 0.7);
  --ink-50: rgba(38, 38, 37, 0.5);
  --ink-20: rgba(38, 38, 37, 0.2);
  --ink-10: rgba(38, 38, 37, 0.1);
  --bone-70: rgba(243, 242, 231, 0.7);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bone);
  color: var(--ink);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  max-width: 100vw;
}

img, video, iframe { max-width: 100%; }

.serif { font-family: 'Cormorant Garamond', 'Cormorant', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
.mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; }
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--taupe);
  font-weight: 400;
}

a { color: inherit; text-decoration: none; }

/* NAV */
.nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 50;
  padding: 28px 48px;
  display: flex; align-items: center; justify-content: space-between;
  transition: padding 0.35s ease, background 0.35s ease, border-color 0.35s ease;
  border-bottom: 1px solid transparent;
  backdrop-filter: blur(0px);
}
.nav.shrunk {
  padding: 14px 48px;
  background: rgba(243, 242, 231, 0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--ink-10);
}
.nav-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  letter-spacing: 0.02em;
  transition: font-size 0.35s ease;
}
.nav.shrunk .nav-brand { font-size: 18px; }
.nav-brand .initials { font-style: italic; }
.nav-links {
  display: flex; gap: 36px;
  align-items: center;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 400;
}
.nav-links a {
  position: relative;
  padding: 4px 0;
  color: var(--ink);
  transition: color 0.2s ease;
}
.nav-links a::after {
  content: '';
  position: absolute; left: 0; right: 100%; bottom: 0;
  height: 1px;
  background: var(--ink);
  transition: right 0.3s ease;
}
.nav-links a:hover::after, .nav-links a.active::after { right: 0; }
.nav-links a.active { color: var(--ink); }

/* NAV DROPDOWN */
.nav-dropdown {
  position: relative;
  padding-bottom: 14px;
  margin-bottom: -14px;
  display: flex;
  align-items: center;
}
.nav-dropdown > a { padding: 4px 0; }
.nav-dropdown-caret { display: none; }
.nav-menu {
  position: absolute;
  top: calc(100% - 6px);
  left: -24px;
  min-width: 320px;

.nav-menu.open {

}
@keyframes navMenuFade {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.nav-menu a {
  display: grid !important;

.nav-menu-num {

}
.nav-menu-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;

/* SECTIONS */
.section { padding: 120px 48px; }
.section-sm { padding: 80px 48px; }
.container { max-width: 1400px; margin: 0 auto; }
.container-narrow { max-width: 1040px; margin: 0 auto; }

/* PLACEHOLDERS */

    repeating-linear-gradient(

}

}
.ph-taupe .ph-label { background: var(--ink); color: var(--cream); }
.ph-ink {
  background: var(--ink);
}
.ph-ink .ph-label { background: var(--cream); color: var(--ink); }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 16px 28px;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 500;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Inter', sans-serif;
}
.btn:hover { background: var(--ink); color: var(--bone); }
.btn-ink { background: var(--ink); color: var(--bone); }

.btn-bone { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.btn-bone:hover { background: transparent; color: var(--bone); }
.btn-arrow { display: inline-block; transition: transform 0.3s ease; }
.btn:hover .btn-arrow { transform: translateX(4px); }

/* ABOUT — gentle motion on portrait + tiles */
.about-portrait img {
  transition: transform 1.2s cubic-bezier(.22,.61,.36,1);
  transform: scale(1.02);
  animation: about-portrait-settle 1.4s 0.2s ease both;
}
@keyframes about-portrait-settle {
  from { transform: scale(1.06) translateY(8px); opacity: 0.6; }
  to   { transform: scale(1.02) translateY(0); opacity: 1; }
}
.about-tile { transition: transform 0.45s ease; }
.about-tile:hover { transform: translateY(-4px); }
.about-tile-image img {
  transition: transform 1.1s cubic-bezier(.22,.61,.36,1), filter 0.4s ease;
}
.about-tile:hover .about-tile-image img {
  transform: scale(1.06);
  filter: saturate(1.05);
}

/* CONTACT — slow ken-burns on the skyline */
.contact-skyline img {
  transition: transform 1.2s ease;
  animation: contact-skyline-kb 26s ease-in-out infinite alternate;
}
@keyframes contact-skyline-kb {
  from { transform: scale(1) translate(0, 0); }
  to   { transform: scale(1.07) translate(-1%, -1%); }
}
@media (prefers-reduced-motion: reduce) {
  .contact-skyline img,
  .about-portrait img { animation: none; }
}

/* COMMUNITY PAGE */

/* PAGE TRANSITION — 1s L·H wipe between routes */
.page-transition {
  position: fixed;
  inset: 0;
  z-index: 9998;
  background: #F3F2E7;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
  transition: opacity 0.28s ease, visibility 0s linear 0.28s;
}
.page-transition.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity 0.22s ease, visibility 0s;
}
.page-transition-inner { text-align: center; transform: translateY(8px); opacity: 0; transition: transform 0.45s ease, opacity 0.45s ease; }
.page-transition.active .page-transition-inner { transform: translateY(0); opacity: 1; }
.page-transition-mark {
  font-family: 'Pinyon Script', serif;
  font-size: 84px;
  color: #262625;
  line-height: 1;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
}
.page-transition-mark .pl-amp {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 28px;
  color: #CBB2A1;
  position: relative;
  top: -22px;
  margin: 0 2px;
}
.page-transition-brand {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 18px;
  color: #7E746A;
  margin-top: 6px;
}
@media (max-width: 640px) {
  .page-transition-mark { font-size: 64px; }
  .page-transition-mark .pl-amp { font-size: 22px; top: -16px; }
  .page-transition-brand { font-size: 16px; }
}

}
.nav.nav-on-hero:not(.shrunk) .nav-burger span { background: #F3F2E7; }

.link-underline {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--ink);
  transition: gap 0.3s ease;
}
.link-underline:hover { gap: 18px; }

/* RULES */
.rule { height: 1px; background: var(--ink-20); width: 100%; }
.rule-cream { background: var(--ink-10); }

/* FORMS */
.field { display: flex; flex-direction: column; gap: 8px; }
.field label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--taupe);
}
.field input, .field textarea, .field select {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--ink-20);
  padding: 10px 0;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s ease;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-bottom-color: var(--ink);
}
.field textarea { resize: vertical; min-height: 100px; }

/* FADE IN */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp 0.9s ease both; }
.fade-up.d1 { animation-delay: 0.1s; }
.fade-up.d2 { animation-delay: 0.2s; }
.fade-up.d3 { animation-delay: 0.35s; }
.fade-up.d4 { animation-delay: 0.5s; }
.fade-up.d5 { animation-delay: 0.65s; }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

/* HOVER IMAGES */
.zoom-wrap { overflow: hidden; }
.zoom-wrap > * {
  transition: transform 0.9s cubic-bezier(.22,.61,.36,1);
}
.zoom-wrap:hover > * { transform: scale(1.04); }

/* TWEAKS PANEL */
.tweaks {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--bone);
  border: 1px solid var(--ink);
  padding: 20px;
  z-index: 100;
  width: 280px;
  display: none;
  box-shadow: 0 20px 40px rgba(0,0,0,0.08);
}
.tweaks.open { display: block; }
.tweaks-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--taupe);
  margin-bottom: 16px;
}
.tweaks h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink);
  font-weight: 500;
  margin: 14px 0 8px;
}
.tweaks-opts { display: flex; flex-direction: column; gap: 6px; }
.tweaks-opts button {
  text-align: left;
  padding: 8px 10px;
  border: 1px solid var(--ink-20);
  background: transparent;
  font-size: 12px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s ease;
}
.tweaks-opts button:hover { border-color: var(--ink); }
.tweaks-opts button.active {
  background: var(--ink);
  color: var(--bone);
  border-color: var(--ink);
}

/* MARQUEE */
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.marquee {
  overflow: hidden;
  border-top: 1px solid var(--ink-20);
  border-bottom: 1px solid var(--ink-20);
  padding: 22px 0;
}
.marquee-track {
  display: flex; gap: 64px;
  animation: marquee 38s linear infinite;
  white-space: nowrap;
}
.marquee span {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 22px;
  color: var(--taupe);
}
.marquee span::before {
  content: '·';
  margin-right: 64px;
  color: var(--clay);
}

/* CALCULATOR */
.calc-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 40px;
}
.calc-field { display: flex; flex-direction: column; gap: 12px; }
.calc-field-label {
  font-size: 13px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 400;
}
.calc-info {
  font-size: 12px;
  color: var(--taupe);
  cursor: help;
}
.calc-field-box {
  border: 1px solid var(--ink);
  padding: 16px 20px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  font-size: 18px;
  font-family: 'Inter', sans-serif;
  background: var(--bone);
  min-height: 56px;
}
.calc-input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  color: var(--ink);
  padding: 0;
  min-width: 0;
  width: 100%;
}
.calc-input:focus { outline: none; }
.calc-prefix, .calc-suffix {
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  color: var(--ink);
}
.calc-prefix { margin-right: 2px; }
.calc-suffix { margin-left: 4px; }
.calc-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--taupe);
}
.calc-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: var(--ink-20);
  outline: none;
  cursor: pointer;
}
.calc-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--ink);
  cursor: pointer;
  border: none;
}
.calc-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--ink);
  cursor: pointer;
  border: none;
}

/* HOME VALUATION */
.val-stepper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 8px 0 0;
}
.val-step { display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 0 0 auto; }
.val-step-dot {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--ink-20);
  color: var(--bone);
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.3s ease;
}
.val-step.active .val-step-dot { background: var(--taupe); }
.val-step.current .val-step-dot { background: var(--ink); }
.val-step-label {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--ink-70);
  white-space: nowrap;
}
.val-step.current .val-step-label { color: var(--ink); font-weight: 500; }
.val-step-line {
  flex: 1;

  height: 1px;
  background: var(--ink-20);
  margin: 0 20px 32px;
  transition: background 0.3s ease;
}
.val-step-line.active { background: var(--taupe); }

.val-card {
  background: var(--bone);
  border: 1px solid var(--ink-20);
  padding: 48px;
}
.val-card-result { padding: 56px 56px 48px; }

.val-form-row {
  display: flex;
  gap: 12px;
  align-items: stretch;
}
.val-field {
  flex: 1;
  border: 1px solid var(--ink);
  background: #fff;
  display: flex;
  align-items: center;
}
.val-field input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  padding: 18px 20px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: var(--ink);
}
.val-field input::placeholder { color: var(--taupe); }
.val-btn {
  background: var(--ink);
  color: var(--bone);
  border: 1px solid var(--ink);

<script>
  // Hold the preloader briefly, then dissolve once React has mounted (or after a max wait).
  (function () {
    var pl = document.getElementById('preloader');
    var minMs = 3000;
    var start = Date.now();
    function dismiss() {
      var elapsed = Date.now() - start;
      var wait = Math.max(0, minMs - elapsed);
      setTimeout(function () {
        pl.classList.add('done');
        setTimeout(function () { pl.remove(); }, 900);
      }, wait);
    }
    // Wait for React root to render at least one child
    var tries = 0;
    var iv = setInterval(function () {
      tries++;
      var root = document.getElementById('root');
      if ((root && root.children.length > 0) || tries > 80) {
        clearInterval(iv);
        dismiss();
      }
    }, 50);
  })();
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroVariant": "quiet",
  "accent": "clay"
}/*EDITMODE-END*/;

function TweaksPanel({ open, tweaks, setTweak }) {
  if (!open) return null;
  return (
    <div className={`tweaks ${open ? 'open' : ''}`}>
      <div className="tweaks-title">Tweaks</div>
      <h4>Homepage Hero Direction</h4>
      <div className="tweaks-opts">
        {[
          ['quiet', '01 · Quiet and Gallery like'],
          ['editorial', '02 · Editorial Split'],
          ['split', '03 · Full bleed Portrait'],
        ].map(([id, label]) => (
          <button key={id} onClick={() => setTweak('heroVariant', id)} className={tweaks.heroVariant === id ? 'active' : ''}>{label}</button>
        ))}
      </div>
      <h4>Accent Tone</h4>
      <div className="tweaks-opts">
        {[
          ['clay', 'Soft Clay · #CBB2A1'],
          ['taupe', 'Muted Taupe · #7E746A'],
          ['ink', 'Near Black · #262625'],
        ].map(([id, label]) => (
          <button key={id} onClick={() => setTweak('accent', id)} className={tweaks.accent === id ? 'active' : ''}>{label}</button>
        ))}
      </div>
    </div>
  );
}

function PageTransition({ active }) {
  return (
    <div className={`page-transition ${active ? 'active' : ''}`} aria-hidden="true">
      <div className="page-transition-inner">
        <div className="page-transition-mark">
          <span className="pl-l">L</span>
          <span className="pl-amp">·</span>
          <span className="pl-h">H</span>
        </div>
        <div className="page-transition-brand">Hoang Properties</div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState(() => localStorage.getItem('loan_page') || 'home');
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [transitioning, setTransitioning] = useState(false);
  const isFirstNav = useRef(true);

  useEffect(() => {
    localStorage.setItem('loan_page', page);
    window.scrollTo({ top: 0, behavior: 'instant' });
    if (isFirstNav.current) { isFirstNav.current = false; return; }
    setTransitioning(true);
    const t = setTimeout(() => setTransitioning(false), 1000);
    return () => clearTimeout(t);
  }, [page]);

  const [buyingTab, setBuyingTab] = useState('overview');
  const [sellingTab, setSellingTab] = useState('overview');
  const [contactIntent, setContactIntent] = useState(null);

  useEffect(() => {
    const accentMap = { clay: '#CBB2A1', taupe: '#7E746A', ink: '#262625' };
    document.documentElement.style.setProperty('--accent', accentMap[tweaks.accent] || '#CBB2A1');
    document.querySelectorAll('em').forEach((el) => {
      if (el.closest('.serif') || el.parentElement?.classList.contains('serif')) {
        el.style.color = accentMap[tweaks.accent];
      }
    });
  }, [tweaks.accent]);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const onNav = (id, sub) => {
    setPage(id);
    if (id === 'buying' && sub) setBuyingTab(sub);
    if (id === 'selling' && sub) setSellingTab(sub);
    if (id === 'contact') setContactIntent(sub || null);
  };

  return (
    <>
      <Nav current={page} onNav={onNav} />
      <main>
        {page === 'home' && <Home heroVariant={tweaks.heroVariant} onNav={onNav} />}
        {page === 'buying' && <Buying onNav={onNav} initialTab={buyingTab} />}
        {page === 'selling' && <Selling onNav={onNav} initialTab={sellingTab} />}
        {page === 'leasing' && <Leasing onNav={onNav} />}
        {page === 'testimonials' && <Testimonials onNav={onNav} />}
        {page === 'about' && <About onNav={onNav} />}
        {page === 'contact' && <Contact onNav={onNav} initialIntent={contactIntent} />}
        {page === 'community' && <Community onNav={onNav} />}
      </main>
      <Footer onNav={onNav} />
      <TweaksPanel open={tweaksOpen} tweaks={tweaks} setTweak={setTweak} />
      <PageTransition active={transitioning} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
