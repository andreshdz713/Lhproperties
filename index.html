<style>/* === Preloader === */
#preloader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #F3F2E7;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  transition: opacity 0.8s ease;
}
#preloader.done {
  opacity: 0;
  pointer-events: none;
}
#preloader .pl-inner {
  text-align: center;
  position: relative;
  padding: 0 80px;
}
#preloader .pl-line {
  height: 1px;
  background: #CBB2A1;
  margin: 0 auto;
  transform-origin: center;
  animation: pl-line-grow 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}
#preloader .pl-line-top {
  width: 0;
  margin-bottom: 38px;
  animation-delay: 0.05s;
}
#preloader .pl-line-bot {
  width: 0;
  margin-top: 38px;
  animation-delay: 0.4s;
}
@keyframes pl-line-grow {
  0% { width: 0; }
  100% { width: 220px; }
}
#preloader .pl-mono {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 96px;
  letter-spacing: 0.04em;
  color: #262625;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  line-height: 1;
}
#preloader .pl-l,
#preloader .pl-h {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
  animation: pl-letter 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
#preloader .pl-l { animation-delay: 0.35s; }
#preloader .pl-h { animation-delay: 0.55s; }
#preloader .pl-amp {
  font-style: italic;
  font-size: 38px;
  color: #CBB2A1;
  opacity: 0;
  transform: scale(0.6);
  animation: pl-amp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.75s forwards;
  position: relative;
  top: -14px;
}
@keyframes pl-letter {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pl-amp {
  to { opacity: 1; transform: scale(1); }
}
#preloader .pl-name {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 13px;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: #262625;
  margin-top: 4px;
  opacity: 0;
  animation: pl-fade-in 0.9s ease 0.95s forwards;
}
#preloader .pl-sub {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 300;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #7E746A;
  margin-top: 14px;
  opacity: 0;
  animation: pl-fade-in 0.9s ease 1.15s forwards;
}
@keyframes pl-fade-in {
  to { opacity: 1; }
}

:root {
  --bone: #F3F2E7;
  --cream: #E3DAC8;
  --clay: #CBB2A1;
  --taupe: #7E746A;
  --ink: #262625;
  --ink-70: rgba(38, 38, 37, 0.7);
  --ink-50: rgba(38, 38, 37, 0.5);
  --ink-20: rgba(38, 38, 37, 0.2);
  --ink-10: rgba(38, 38, 37, 0.1);
  --bone-70: rgba(243, 242, 231, 0.7);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bone);
  color: var(--ink);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.serif { font-family: 'Cormorant Garamond', 'Cormorant', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
.mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; }
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--taupe);
  font-weight: 400;
}

a { color: inherit; text-decoration: none; }

/* NAV */
.nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 50;
  padding: 28px 48px;
  display: flex; align-items: center; justify-content: space-between;
  transition: padding 0.35s ease, background 0.35s ease, border-color 0.35s ease;
  border-bottom: 1px solid transparent;
  backdrop-filter: blur(0px);
}
.nav.shrunk {
  padding: 14px 48px;
  background: rgba(243, 242, 231, 0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--ink-10);
}
.nav-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  letter-spacing: 0.02em;
  transition: font-size 0.35s ease;
}
.nav.shrunk .nav-brand { font-size: 18px; }
.nav-brand .initials { font-style: italic; }
.nav-links {
  display: flex; gap: 36px;
  align-items: center;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 400;
}
.nav-links a {
  position: relative;
  padding: 4px 0;
  color: var(--ink);
  transition: color 0.2s ease;
}
.nav-links a::after {
  content: '';
  position: absolute; left: 0; right: 100%; bottom: 0;
  height: 1px;
  background: var(--ink);
  transition: right 0.3s ease;
}
.nav-links a:hover::after, .nav-links a.active::after { right: 0; }
.nav-links a.active { color: var(--ink); }

/* NAV DROPDOWN */
.nav-dropdown {
  position: relative;
  padding-bottom: 14px;
  margin-bottom: -14px;
  display: flex;
  align-items: center;
}
.nav-dropdown > a { padding: 4px 0; }
.nav-menu {
  position: absolute;
  top: calc(100% - 6px);
  left: -24px;
  min-width: 320px;
  background: var(--bone);
  border: 1px solid var(--ink);
  padding: 12px;
  display: none;
  box-shadow: 0 24px 60px rgba(38, 38, 37, 0.12);
  z-index: 60;
}
.nav-menu.open {
  display: block;
  animation: navMenuFade 0.25s ease;
}
@keyframes navMenuFade {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.nav-menu a {
  display: grid !important;
  grid-template-columns: 32px 1fr;
  align-items: start;
  gap: 14px;
  padding: 14px 16px;
  text-transform: none;
  letter-spacing: 0;
  font-size: inherit;
  transition: background 0.2s ease;
  position: relative;
}
.nav-menu a > span { display: block; }
.nav-menu a > span:last-child { display: flex; flex-direction: column; }
.nav-menu a::after { display: none; }
.nav-menu a:hover { background: var(--cream); }
.nav-menu-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--taupe);
  padding-top: 4px;
}
.nav-menu-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: -0.01em;
  display: block !important;
  color: var(--ink);
  text-transform: none;
  line-height: 1.2;
}
.nav-menu-sub {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  color: var(--taupe);
  display: block !important;
  margin-top: 4px;
  text-transform: none;
  letter-spacing: 0;
  line-height: 1.4;
}

/* SECTIONS */
.section { padding: 120px 48px; }
.section-sm { padding: 80px 48px; }
.container { max-width: 1400px; margin: 0 auto; }
.container-narrow { max-width: 1040px; margin: 0 auto; }

/* PLACEHOLDERS */
.ph {
  background:
    repeating-linear-gradient(
      135deg,
      var(--cream) 0 12px,
      #dfd5c0 12px 24px
    );
  position: relative;
  overflow: hidden;
  display: flex; align-items: flex-end;
  color: var(--ink-70);

<script>
  // Hold the preloader briefly, then dissolve once React has mounted (or after a max wait).
  (function () {
    var pl = document.getElementById('preloader');
    var minMs = 2200;
    var start = Date.now();
    function dismiss() {
      var elapsed = Date.now() - start;
      var wait = Math.max(0, minMs - elapsed);
      setTimeout(function () {
        pl.classList.add('done');
        setTimeout(function () { pl.remove(); }, 900);
      }, wait);
    }
    // Wait for React root to render at least one child
    var tries = 0;
    var iv = setInterval(function () {
      tries++;
      var root = document.getElementById('root');
      if ((root && root.children.length > 0) || tries > 80) {
        clearInterval(iv);
        dismiss();
      }
    }, 50);
  })();
</script>

      <h4>Homepage Hero Direction</h4>
      <div className="tweaks-opts">
        {[
          ['quiet', '01 · Quiet and Gallery like'],
          ['editorial', '02 · Editorial Split'],
          ['split', '03 · Full bleed Portrait'],
        ].map(([id, label]) => (
          <button key={id} onClick={() => setTweak('heroVariant', id)} className={tweaks.heroVariant === id ? 'active' : ''}>{label}</button>
        ))}
      </div>
      <h4>Accent Tone</h4>
      <div className="tweaks-opts">
        {[
          ['clay', 'Soft Clay · #CBB2A1'],
          ['taupe', 'Muted Taupe · #7E746A'],
          ['ink', 'Near Black · #262625'],
        ].map(([id, label]) => (
          <button key={id} onClick={() => setTweak('accent', id)} className={tweaks.accent === id ? 'active' : ''}>{label}</button>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState(() => localStorage.getItem('loan_page') || 'home');
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  useEffect(() => {
    localStorage.setItem('loan_page', page);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [page]);

  const [buyingTab, setBuyingTab] = useState('overview');
  const [sellingTab, setSellingTab] = useState('overview');

  useEffect(() => {
    const accentMap = { clay: '#CBB2A1', taupe: '#7E746A', ink: '#262625' };
    document.documentElement.style.setProperty('--accent', accentMap[tweaks.accent] || '#CBB2A1');
    document.querySelectorAll('em').forEach((el) => {
      if (el.closest('.serif') || el.parentElement?.classList.contains('serif')) {
        el.style.color = accentMap[tweaks.accent];
      }
    });
  }, [tweaks.accent]);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const onNav = (id, sub) => {
    setPage(id);
    if (id === 'buying' && sub) setBuyingTab(sub);
    if (id === 'selling' && sub) setSellingTab(sub);
  };

  return (
    <>
      <Nav current={page} onNav={onNav} />
      <main>
        {page === 'home' && <Home heroVariant={tweaks.heroVariant} onNav={onNav} />}
        {page === 'buying' && <Buying onNav={onNav} initialTab={buyingTab} />}
        {page === 'selling' && <Selling onNav={onNav} initialTab={sellingTab} />}
        {page === 'leasing' && <Leasing onNav={onNav} />}
        {page === 'testimonials' && <Testimonials onNav={onNav} />}
        {page === 'about' && <About onNav={onNav} />}
        {page === 'contact' && <Contact onNav={onNav} />}
      </main>
      <Footer onNav={onNav} />
      <TweaksPanel open={tweaksOpen} tweaks={tweaks} setTweak={setTweak} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
